<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <defs>
    <style>
      .title { font: bold 28px sans-serif; fill: #0f172a; }
      .subtitle { font: 18px sans-serif; fill: #334155; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 20; }
      .laneTitle { font: bold 22px sans-serif; fill: #0f172a; }
      .box { fill: white; stroke: #334155; stroke-width: 2; rx: 14; }
      .entry { fill: #eff6ff; }
      .method { fill: #eef2ff; }
      .model { fill: #fff7ed; }
      .leaf { fill: #ecfdf5; }
      .boxText { font: 16px sans-serif; fill: #0f172a; }
      .small { font: 14px sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .darrow { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .note { font: 14px sans-serif; fill: #475569; }
      .chip { fill: #0f172a; }
      .chipText { font: bold 14px sans-serif; fill: white; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569" />
    </marker>
  </defs>

  <text x="60" y="52" class="title">FlyPrompt online_evaluate 调用图</text>
  <text x="60" y="84" class="subtitle">从 main.py 一层层走到模型底层，展示评估时路由更新、expert 选择、多头推理和统计汇总</text>

  <!-- L0 -->
  <rect x="40" y="120" width="2120" height="180" class="lane"/>
  <text x="70" y="155" class="laneTitle">入口层 / Entry</text>
  <rect x="70" y="185" width="300" height="85" class="box entry"/>
  <text x="90" y="215" class="boxText">main.py</text>
  <text x="90" y="240" class="small">解析 CLI 参数</text>
  <rect x="410" y="185" width="360" height="85" class="box entry"/>
  <text x="430" y="215" class="boxText">METHODS["flyprompt"]</text>
  <text x="430" y="240" class="small">构建 FlyPrompt trainer</text>
  <rect x="810" y="185" width="260" height="85" class="box entry"/>
  <text x="830" y="215" class="boxText">_Trainer.run()</text>
  <text x="830" y="240" class="small">进入训练主循环</text>
  <path class="arrow" d="M370 227 L410 227"/>
  <path class="arrow" d="M770 227 L810 227"/>

  <!-- L1 -->
  <rect x="40" y="330" width="2120" height="300" class="lane"/>
  <text x="70" y="365" class="laneTitle">训练器层 / Trainer</text>
  <rect x="70" y="405" width="340" height="95" class="box method"/>
  <text x="90" y="437" class="boxText">_Trainer.main_worker()</text>
  <text x="90" y="463" class="small">构建数据、模型、循环</text>
  <rect x="460" y="405" width="290" height="95" class="box method"/>
  <text x="480" y="437" class="boxText">达到 eval_period</text>
  <text x="480" y="463" class="small">触发周期评估</text>
  <rect x="790" y="405" width="310" height="95" class="box method"/>
  <text x="810" y="437" class="boxText">任务结束 / epoch 结束</text>
  <text x="810" y="463" class="small">触发任务末评估</text>
  <rect x="1140" y="405" width="360" height="95" class="box method"/>
  <text x="1160" y="437" class="boxText">online_evaluate(...)</text>
  <text x="1160" y="463" class="small">调用子类评估钩子</text>
  <rect x="1540" y="405" width="340" height="95" class="box method"/>
  <text x="1560" y="437" class="boxText">归约 + 日志</text>
  <text x="1560" y="463" class="small">分布式汇总评估结果</text>
  <path class="arrow" d="M410 452 L460 452"/>
  <path class="arrow" d="M750 452 L790 452"/>
  <path class="arrow" d="M1100 452 L1140 452"/>
  <path class="arrow" d="M1500 452 L1540 452"/>

  <rect x="70" y="535" width="1900" height="65" class="box" style="fill:#fefce8; stroke:#ca8a04;"/>
  <text x="90" y="562" class="boxText">说明：训练器层决定“什么时候评估”，真正的评估逻辑在 FlyPrompt 方法层里。</text>
  <text x="90" y="586" class="small">周期触发和任务末触发都会进入同一个 online_evaluate() 实现。</text>

  <!-- L2 -->
  <rect x="40" y="660" width="2120" height="380" class="lane"/>
  <text x="70" y="695" class="laneTitle">FlyPrompt 方法层 / methods.flyprompt.FlyPrompt</text>
  <rect x="70" y="735" width="270" height="95" class="box model"/>
  <text x="90" y="767" class="boxText">online_evaluate()</text>
  <text x="90" y="793" class="small">评估入口</text>
  <rect x="380" y="735" width="310" height="95" class="box model"/>
  <text x="400" y="767" class="boxText">model_without_ddp.update()</text>
  <text x="400" y="793" class="small">先刷新 RP 路由器</text>
  <rect x="730" y="735" width="310" height="95" class="box model"/>
  <text x="750" y="767" class="boxText">forward_with_rp(x)</text>
  <text x="750" y="793" class="small">用 RP 选 expert</text>
  <rect x="1080" y="735" width="250" height="95" class="box model"/>
  <text x="1100" y="767" class="boxText">argmax(logit_raw)</text>
  <text x="1100" y="793" class="small">得到 expert_ids</text>
  <rect x="1360" y="735" width="330" height="95" class="box model"/>
  <text x="1380" y="767" class="boxText">forward_with_ema(x, expert_ids)</text>
  <text x="1380" y="793" class="small">按 expert 做多头推理</text>
  <rect x="1720" y="735" width="250" height="95" class="box model"/>
  <text x="1740" y="767" class="boxText">_ensemble_logits(...)</text>
  <text x="1740" y="793" class="small">融合多头输出</text>
  <rect x="70" y="865" width="280" height="95" class="box model"/>
  <text x="90" y="897" class="boxText">_interpret_pred(y, pred)</text>
  <text x="90" y="923" class="small">统计每类正确数</text>
  <rect x="390" y="865" width="260" height="95" class="box model"/>
  <text x="410" y="897" class="boxText">avg_acc / avg_loss</text>
  <text x="410" y="923" class="small">汇总评估结果</text>
  <path class="arrow" d="M340 782 L380 782"/>
  <path class="arrow" d="M690 782 L730 782"/>
  <path class="arrow" d="M1040 782 L1080 782"/>
  <path class="arrow" d="M1330 782 L1360 782"/>
  <path class="arrow" d="M1690 782 L1720 782"/>
  <path class="arrow" d="M1845 830 L1845 865 L350 865"/>
  <path class="arrow" d="M350 912 L390 912"/>

  <rect x="70" y="985" width="1880" height="35" class="chip" rx="18"/>
  <text x="90" y="1009" class="chipText">关键理解：在线评估不是单纯 forward，而是“先结算路由器，再按路由器选 expert，再做多头推理，再聚合”。</text>

  <!-- L3 -->
  <rect x="40" y="1075" width="2120" height="240" class="lane"/>
  <text x="70" y="1110" class="laneTitle">模型层 / models.flyprompt.FlyPrompt</text>
  <rect x="70" y="1145" width="270" height="90" class="box leaf"/>
  <text x="90" y="1176" class="boxText">FlyPrompt.update()</text>
  <text x="90" y="1200" class="small">委托给 RPFC.update</text>
  <rect x="380" y="1145" width="300" height="90" class="box leaf"/>
  <text x="400" y="1176" class="boxText">FlyPrompt.forward_with_rp()</text>
  <text x="400" y="1200" class="small">backbone + RPFC</text>
  <rect x="720" y="1145" width="330" height="90" class="box leaf"/>
  <text x="740" y="1176" class="boxText">FlyPrompt.forward_with_ema()</text>
  <text x="740" y="1200" class="small">backbone + prompt experts + EMA heads</text>
  <rect x="1090" y="1145" width="300" height="90" class="box leaf"/>
  <text x="1110" y="1176" class="boxText">FlyPrompt.collect()</text>
  <text x="1110" y="1200" class="small">训练时累计 RP 统计</text>
  <path class="arrow" d="M340 1190 L380 1190"/>
  <path class="arrow" d="M680 1190 L720 1190"/>
  <path class="arrow" d="M1050 1190 L1090 1190"/>

  <!-- L4 -->
  <rect x="40" y="1350" width="2120" height="300" class="lane"/>
  <text x="70" y="1385" class="laneTitle">叶子实现 / Leaf Functions</text>
  <rect x="70" y="1420" width="340" height="95" class="box leaf"/>
  <text x="90" y="1452" class="boxText">RPFC.update()</text>
  <text x="90" y="1478" class="small">(G + ridge I)^-1 Q</text>
  <rect x="450" y="1420" width="280" height="95" class="box leaf"/>
  <text x="470" y="1452" class="boxText">RPFC.forward()</text>
  <text x="470" y="1478" class="small">随机投影 + 线性层</text>
  <rect x="770" y="1420" width="300" height="95" class="box leaf"/>
  <text x="790" y="1452" class="boxText">Prompt.forward()</text>
  <text x="790" y="1478" class="small">把 prompt 插入 ViT 多层</text>
  <rect x="1110" y="1420" width="300" height="95" class="box leaf"/>
  <text x="1130" y="1452" class="boxText">RPFC.collect()</text>
  <text x="1130" y="1478" class="small">累计 G/Q 统计量</text>
  <rect x="1450" y="1420" width="290" height="95" class="box leaf"/>
  <text x="1470" y="1452" class="boxText">Prompt.init_new_expert()</text>
  <text x="1470" y="1478" class="small">旧 prompt 均值 warm start</text>
  <rect x="1770" y="1420" width="250" height="95" class="box leaf"/>
  <text x="1790" y="1452" class="boxText">init_fc()</text>
  <text x="1790" y="1478" class="small">初始化新分类头</text>
  <path class="arrow" d="M410 1468 L450 1468"/>
  <path class="arrow" d="M730 1468 L770 1468"/>
  <path class="arrow" d="M1070 1468 L1110 1468"/>
  <path class="arrow" d="M1410 1468 L1450 1468"/>
  <path class="arrow" d="M1740 1468 L1770 1468"/>

  <text x="70" y="1665" class="note">说明：虚线关系表示训练期依赖（collect 促进后续 update 和新 expert 初始化），实线表示评估时的直接调用关系。</text>
</svg>
