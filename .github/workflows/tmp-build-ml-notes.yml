name: Temporary ML Notes PDF Build
on:
  pull_request:
    branches: [ main ]
jobs:
  build-pdf:
    if: github.head_ref == 'tmp-ml-notes-pdf-20260626'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq texlive-xetex texlive-lang-chinese texlive-latex-extra >/dev/null 2>&1
      - name: Build PDF
        id: build
        continue-on-error: true
        working-directory: tmp_pdf
        run: |
          set +e
          sed -i '/\\usepackage{microtype}/a \\tcbuselibrary{breakable,skins}' ml_notes_retypeset.tex
          xelatex -interaction=nonstopmode -halt-on-error ml_notes_retypeset.tex >build.out 2>&1
          STATUS=$?
          if [ $STATUS -eq 0 ]; then
            xelatex -interaction=nonstopmode -halt-on-error ml_notes_retypeset.tex >build2.out 2>&1
            STATUS=$?
          fi
          tail -n 200 ml_notes_retypeset.log >build_tail.txt 2>/dev/null || true
          echo $STATUS >build_status.txt
          exit $STATUS
      - name: Publish diagnostics to branch
        if: always()
        run: |
          cp tmp_pdf/build_tail.txt /tmp/build_tail.txt || true
          cp tmp_pdf/build.out /tmp/build.out || true
          cp tmp_pdf/build_status.txt /tmp/build_status.txt || true
          git fetch origin tmp-ml-notes-pdf-20260626
          git checkout tmp-ml-notes-pdf-20260626
          cp /tmp/build_tail.txt tmp_pdf/build_tail_latest.txt || true
          cp /tmp/build.out tmp_pdf/build_out_latest.txt || true
          cp /tmp/build_status.txt tmp_pdf/build_status_latest.txt || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tmp_pdf/build_*_latest.txt
          git commit -m 'Save temporary TeX diagnostics [skip ci]' || true
          git push origin tmp-ml-notes-pdf-20260626
      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-notes-pdf
          path: tmp_pdf/ml_notes_retypeset.pdf
          if-no-files-found: ignore
